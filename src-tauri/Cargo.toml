[package]
name = "trellis-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "trellis-viewer"

[lib]
name = "trellis_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
ts-rs = { version = "11", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
